<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Small Diya · A Diwali story by Saurabh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap">
<style>
:root{color-scheme:dark;--gold:#ffc54a;--cream:#fff1d6}
html,body{height:100%;margin:0;background:#080c1c;overflow:hidden;font-family:"Yatra One",Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#txt{position:fixed;left:0;right:0;top:calc(9% + env(safe-area-inset-top,0px));padding:0 8%;text-align:center;font-size:clamp(21px,5.2vw,38px);line-height:1.35;color:var(--cream);opacity:0;transition:opacity .6s ease;text-shadow:0 2px 18px #000}
#txt.on{opacity:1}
#txt b{font-weight:400;color:var(--gold)}
#txt.end{font-size:clamp(36px,10.5vw,72px);color:var(--gold)}
#txt small{display:block;margin-top:12px;font-size:.45em;color:var(--cream)}
#txt em{display:block;margin-top:18px;font-style:normal;font-size:.38em;color:var(--cream)}
#by{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top,0px));font-size:15px;color:var(--gold);opacity:0;transition:opacity 1s}
#by.on{opacity:.9}
button{position:fixed;left:50%;transform:translateX(-50%);font-family:inherit;font-size:18px;padding:14px 30px;border-radius:40px;border:2px solid var(--gold);background:rgba(8,12,28,.75);color:var(--gold);cursor:pointer}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
#go{bottom:46%}
#re{bottom:calc(5% + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="by">🪔 by Saurabh</div>
<div id="txt" aria-live="polite"></div>
<button id="go">Begin the story</button>
<button id="re" hidden>Watch again</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),T=document.getElementById('txt'),go=document.getElementById('go'),re=document.getElementById('re'),BY=document.getElementById('by');
let W,H,u,gy,by,mx,fx,houses,rain,stars,parts=[],t0=null,cur=-1,lastB=0,seed=3;
const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const cl=v=>Math.max(0,Math.min(1,v)),ez=k=>k*k*(3-2*k),lp=(a,b,k)=>a+(b-a)*k;
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*k))})`;
const S=[
[0.5,'Some nights feel heavier than others.'],
[5,'He sat alone while the whole city celebrated without him.'],
[9.5,'Then <b>Saurabh</b> walked over, carrying one small diya.'],
[14.5,'No big speech. Just a tiny flame.'],
[18,'And slowly, the dark began to feel smaller.'],
[23,'Sometimes all it takes is someone who shows up.'],
[29,'Happy Diwali!<small>Be someone’s diya.</small><em>A story created by <b>Saurabh</b></em>']];
function build(){
 const D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);seed=3;
 u=Math.min(W/9,H/15);gy=H*.78;by=gy-1.2*u;mx=W*.58;fx=mx-2.4*u;
 stars=Array.from({length:60},()=>({x:R()*W,y:R()*H*.5,r:R()*1.3+.3,p:R()*6}));
 rain=Array.from({length:110},()=>({x:R()*W,y:R()*H,v:9+R()*6}));
 houses=[];let hx=-10;const base=gy-.5*u;
 while(hx<W){const w=u*(1+R()*.9),h=u*(2.4+R()*2.6),wins=[];
  for(let i=0;i<2;i++)for(let j=0;j<Math.floor(h/(u*.9));j++)wins.push({x:hx+w*.18+i*w*.4,y:base-h+u*.3+j*u*.85,lit:19+R()*5});
  houses.push({x:hx,w,h,wins});hx+=w+u*.1}
}
function glow(px,py,r,a,col){const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2)}
function rr(a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h);x.fill()}
function diya(px,py,r,k,t){
 x.fillStyle='#c8602a';x.beginPath();x.moveTo(px-r,py-r*.3);x.quadraticCurveTo(px,py+r*1.4,px+r,py-r*.3);x.closePath();x.fill();
 x.fillStyle='#ffc54a';x.fillRect(px-r,py-r*.4,r*2,r*.2);
 if(k>0){const f=1+Math.sin(t*14)*.08+Math.sin(t*23)*.05,h=r*2.6*k*f;
  x.fillStyle='#ff7a18';x.beginPath();x.ellipse(px,py-r*.4-h*.5,r*.35*k,h*.5,0,0,6.3);x.fill();
  x.fillStyle='#fff3b0';x.beginPath();x.ellipse(px,py-r*.4-h*.38,r*.17*k,h*.3,0,0,6.3);x.fill()}}
function face(cx,cy,r,k){x.fillStyle='#2a1a14';[-1,1].forEach(s=>{x.beginPath();x.arc(cx+s*r*.38,cy-r*.05,r*.09,0,6.3);x.fill()});
 x.strokeStyle='#2a1a14';x.lineWidth=r*.1;x.lineCap='round';x.beginPath();x.moveTo(cx-r*.35,cy+r*.45);x.quadraticCurveTo(cx,cy+r*.45+k*r*.9,cx+r*.35,cy+r*.45);x.stroke()}
function burst(){const bx=W*(.15+R()*.7),by2=H*(.18+R()*.22),col=['255,197,74','255,79,123','255,138,31','170,120,255','120,220,255'][Math.floor(R()*5)];
 for(let i=0;i<44;i++){const a=i/44*6.283,v=1.2+R()*2.4;parts.push({x:bx,y:by2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,col})}}
function frame(){
 const t=t0==null?0:(performance.now()-t0)/1000,w=cl((t-15.8)/5.5),h=cl((t-17.5)/3.5);
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,mix([8,12,28],[29,18,68],w));g.addColorStop(.75,mix([22,30,50],[120,50,62],w));g.addColorStop(1,mix([14,18,32],[60,28,44],w));
 x.fillStyle=g;x.fillRect(0,0,W,H);
 stars.forEach(s=>{x.fillStyle=`rgba(255,241,214,${(.2+.5*w)*(.6+.4*Math.sin(t*2+s.p))})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()});
 const base=gy-.5*u;
 houses.forEach(o=>{x.fillStyle=mix([14,18,34],[26,14,40],w);x.fillRect(o.x,base-o.h,o.w,o.h);
  o.wins.forEach(q=>{const on=t>q.lit;if(on){x.globalCompositeOperation='lighter';glow(q.x+u*.1,q.y+u*.15,u*.9,.4,'255,170,60');x.globalCompositeOperation='source-over'}
   x.fillStyle=on?'#ffd27a':'#1a2038';x.fillRect(q.x,q.y,u*.22,u*.32)})});
 x.fillStyle=mix([10,14,26],[22,12,30],w);x.fillRect(0,base,W,H-base);
 // bench
 x.fillStyle=mix([60,50,50],[110,64,44],w);x.fillRect(mx-1.7*u,by,4.4*u,.25*u);x.fillRect(mx-1.5*u,by,.2*u,gy-by);x.fillRect(mx+2.3*u,by,.2*u,gy-by);
 // man
 const mx2=mx+.9*u,hd=(1-h)*.45*u,cy=by-2.55*u+hd,tor=mix([70,84,120],[225,120,80],w);
 x.fillStyle=mix([30,36,56],[60,44,70],w);rr(mx2-.65*u,by,.5*u,gy-by,u*.1);rr(mx2+.15*u,by,.5*u,gy-by,u*.1);
 x.fillStyle=tor;rr(mx2-.75*u,by-2*u,1.5*u,2.1*u,u*.4);
 x.strokeStyle=tor;x.lineWidth=.3*u;x.lineCap='round';[-1,1].forEach(s=>{x.beginPath();x.moveTo(mx2+s*.7*u,by-1.7*u);x.lineTo(mx2+s*(.55-h*.2)*u,by-.1*u+(h*-.1)*u);x.stroke()});
 x.fillStyle='#e2b28c';x.beginPath();x.arc(mx2,cy,.55*u,0,6.3);x.fill();
 x.fillStyle='#1c1410';x.beginPath();x.arc(mx2,cy-.03*u,.57*u,Math.PI*1.02,Math.PI*1.98);x.fill();
 face(mx2,cy,.55*u,h*1.5-.65);
 // friend
 const fp=cl((t-9)/4.5),fxx=lp(-2*u,fx,ez(fp)),walk=fp>0&&fp<1,sw=walk?Math.sin(t*10)*.35*u:0;
 const held={x:fxx+.95*u,y:gy-2.4*u},put={x:mx-1.2*u,y:by-.2*u},pk=ez(cl((t-14.2)/1.2)),rk=ez(cl((t-15.6)/1));
 let hand=pk<1?{x:lp(held.x,put.x,pk),y:lp(held.y,put.y,pk)}:{x:lp(put.x,fxx+.6*u,rk),y:lp(put.y,gy-2*u,rk)};
 const fc='#ff8a1f';x.fillStyle='#2b2438';rr(fxx-.5*u+sw,gy-1.6*u,.45*u,1.6*u,u*.1);rr(fxx+.05*u-sw,gy-1.6*u,.45*u,1.6*u,u*.1);
 x.fillStyle=fc;rr(fxx-.65*u,gy-3.5*u,1.3*u,2.1*u,u*.4);
 x.strokeStyle=fc;x.lineWidth=.28*u;x.lineCap='round';x.beginPath();x.moveTo(fxx+.5*u,gy-3.2*u);x.lineTo(hand.x,hand.y);x.stroke();
 x.beginPath();x.moveTo(fxx-.5*u,gy-3.2*u);x.lineTo(fxx-.6*u-sw*.5,gy-2*u);x.stroke();
 x.fillStyle='#e2b28c';x.beginPath();x.arc(fxx,gy-4*u,.5*u,0,6.3);x.fill();
 x.fillStyle='#1c1410';x.beginPath();x.arc(fxx,gy-4.03*u,.52*u,Math.PI*1.02,Math.PI*1.98);x.fill();
 face(fxx,gy-4*u,.5*u,.5);
 // diya + glow
 const lit=cl((t-15.8)*2),dp=t<9.5?null:(pk<1?{x:hand.x,y:hand.y-.15*u}:{x:put.x,y:put.y-.05*u});
 if(dp){if(lit>0){x.globalCompositeOperation='lighter';glow(dp.x,dp.y-.4*u,u*(1.5+w*6.5),.55*lit,'255,150,50');x.globalCompositeOperation='source-over'}diya(dp.x,dp.y,.28*u,lit,t)}
 // rain
 const ra=.4*(1-cl((t-16)/4));
 if(ra>0.01&&t0!=null||t0==null){x.strokeStyle=`rgba(170,190,230,${t0==null?.3:ra})`;x.lineWidth=1;rain.forEach(d=>{d.y+=d.v;d.x-=1.5;if(d.y>H){d.y=-10;d.x=R()*W+30}x.beginPath();x.moveTo(d.x,d.y);x.lineTo(d.x+2,d.y-14);x.stroke()})}
 // fireworks
 if(t>23&&t-lastB>(t>29?1.2:.7)){burst();lastB=t}
 x.globalCompositeOperation='lighter';parts=parts.filter(p=>p.l>0);
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.vx*=.985;p.l-=.011;x.fillStyle=`rgba(${p.col},${Math.max(p.l,0)})`;x.beginPath();x.arc(p.x,p.y,2,0,6.3);x.fill()});
 x.globalCompositeOperation='source-over';
 if(t0!=null){let i=-1;S.forEach((s,n)=>{if(t>=s[0])i=n});
  if(i!=cur){cur=i;T.classList.remove('on');setTimeout(()=>{if(cur<0)return;T.innerHTML=S[cur][1];T.classList.toggle('end',cur==6);T.classList.add('on')},cur<0?0:500)}
  if(t>36&&re.hidden)re.hidden=false}
 requestAnimationFrame(frame)}
function start(){t0=performance.now();cur=-1;lastB=0;parts=[];go.hidden=true;re.hidden=true;T.classList.remove('on');BY.classList.add('on')}
go.onclick=start;re.onclick=start;addEventListener('resize',build);
build();frame();
</script>
</body>
</html>
